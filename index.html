<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Wallah Community</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      height: 100%;
    }

    /* Password Modal */
    .password-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .password-modal.hidden {
      display: none;
    }

    .password-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 3rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .password-input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 16px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .password-btn {
      width: 100%;
      padding: 0.9rem;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .password-error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 1rem;
      display: none;
    }

    /* Layout */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #0f0f0f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 100;
    }

    .logo {
      width: 35px;
      height: 35px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-weight: bold;
    }

    .sidebar-left {
      width: 280px;
      background: #0f0f0f;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 80px;
      position: fixed;
      height: 100vh;
    }

    .sidebar-item {
      padding: 0.9rem 1.5rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    .sidebar-item.active {
      background: rgba(99, 102, 241, 0.2);
      border-left: 3px solid #6366f1;
      color: white;
    }

    .main-content {
      margin-left: 280px;
      margin-top: 60px;
      padding: 2rem;
    }

    /* Messages */
    .message-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    .message-header {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
    }

    .message-content {
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 1rem;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
    }

    .action-button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .add-button {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      background: #6366f1;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .exit-link {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .sidebar-left { display: none; }
      .main-content { margin-left: 0; padding: 1rem; }
    }
  </style>
</head>
<body>

<div class="password-modal" id="passwordModal">
  <div class="password-box">
    <h2>PW Community</h2>
    <p style="margin-bottom: 1.5rem; color: gray;">Enter password</p>
    <input type="password" id="passwordInput" class="password-input" placeholder="Password">
    <div id="passwordError" class="password-error">Incorrect Password</div>
    <button class="password-btn" onclick="checkPassword()">Enter</button>
  </div>
</div>

<div class="header">
  <div style="display: flex; align-items: center; gap: 10px;">
    <div class="logo">PW</div>
    <div class="header-title">Physics Wallah Community</div>
  </div>
  <a href="https://www.pw.live/study-v2/study" class="exit-link" target="pw_study">← Exit</a>
</div>

<div class="sidebar-left">
  <div class="sidebar-item active">💬 Student Discussion</div>
</div>

<div class="main-content" id="mainContent">
  <h2 style="margin-bottom: 2rem;">Student Discussion Channel</h2>
  <div id="messageContainer"></div> </div>

<button class="add-button" id="addBtn">+</button>

<script>
  const PASS = '2525';
  const container = document.getElementById('messageContainer');

  // Check Password
  function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    if(input === PASS) {
      document.getElementById('passwordModal').classList.add('hidden');
    } else {
      document.getElementById('passwordError').style.display = 'block';
    }
  }

  // SAVE DATA LOGIC
  function saveMessage(text) {
    // 1. Get existing messages from PC storage
    let messages = JSON.parse(localStorage.getItem('my_messages')) || [];
    
    // 2. Add new message to the list
    const newMsg = { text: text, date: new Date().toLocaleTimeString() };
    messages.unshift(newMsg); // Put newest at the top
    
    // 3. Save the updated list back to the PC
    localStorage.setItem('my_messages', JSON.stringify(messages));
    
    // 4. Update the screen
    displayMessages();
  }

  function displayMessages() {
    container.innerHTML = ''; // Clear screen
    const messages = JSON.parse(localStorage.getItem('my_messages')) || [];
    
    messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'message-box';
      div.innerHTML = `
        <div class="message-header">
          <div class="avatar">U</div>
          <div>
            <strong>You</strong><br>
            <small style="color:gray">${msg.date}</small>
          </div>
        </div>
        <div class="message-content">${msg.text}</div>
        <div class="action-buttons">
          <button class="action-button">💬 Comment</button>
          <button class="action-button">↗ Share</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  // Handle + Button
  document.getElementById('addBtn').addEventListener('click', () => {
    const text = prompt("Type your message:");
    if(text && text.trim() !== "") {
      saveMessage(text);
    }
  });

  // Load saved data when the page opens
  window.onload = displayMessages;
</script>

</body>
</html>
